name: auth-check
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pick older CLI versions
        run: |
          npm view @anthropic-ai/claude-code versions --json | python3 -c "import sys,json; v=[x for x in json.load(sys.stdin) if '-' not in x]; print(' '.join([v[-1], v[-15], v[-40], v[-80]]))" > versions.txt
          cat versions.txt
      - name: Try each version
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          for v in $(cat versions.txt); do
            echo "=== claude-code $v"
            npm install -g --silent @anthropic-ai/claude-code@$v >/dev/null 2>&1
            claude -p 'Reply with the single word ok' --output-format json < /dev/null 2>&1 | python3 scripts/auth_check.py
          done
