name: auth-check
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm install -g --silent @anthropic-ai/claude-code && claude --version
      - name: Ask for ok with each model setting
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          for m in default sonnet claude-sonnet-5-5 haiku; do
            echo "=== model: $m"
            if [ "$m" = default ]; then A=""; else A="--model $m"; fi
            claude -p 'Reply with the single word ok' $A --output-format json < /dev/null 2>&1 | python3 scripts/auth_check.py
          done
